# ============================================
# Application
# ============================================
spring.application.name=connect-auth-service
server.port=8081
server.address=0.0.0.0

# ============================================
# Database
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/connect_auth?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Eureka
# ============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# DHCP-safe settings
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

# ============================================
# JWT
# ============================================
jwt.secret=MySuperSecretKeyMustBeAtLeast32BytesLongForHS256Algorithm
jwt.expiration=86400000

# ============================================
# OTP
# ============================================
otp.expiration=300

# ============================================
# Logging
# ============================================
logging.level.root=INFO
logging.level.com.connectapp.auth=DEBUG

# ============================================
# Jackson
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ============================================
# Actuator
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================
# APPLICATION PROPERTIES - Auth Service
# ============================================

# Application Name
spring.application.name=connect-auth-service

# Server Port
server.port=8081

# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/connect_auth?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# EUREKA CLIENT CONFIGURATION
# ============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ============================================
# JWT CONFIGURATION
# ============================================
# Secret key must be at least 32 bytes (256 bits) for HS256
jwt.secret=MySuperSecretKeyMustBeAtLeast32BytesLongForHS256Algorithm
# Token expiration: 86400000 ms = 24 hours
jwt.expiration=86400000

# ============================================
# OTP CONFIGURATION
# ============================================
# OTP expiration: 300000 ms = 5 minutes
otp.expiration=300000

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.com.connectapp.auth=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# TWILIO CONFIGURATION (Optional - if using Twilio for SMS)
# ============================================
# twilio.account.sid=YOUR_ACCOUNT_SID
# twilio.auth.token=YOUR_AUTH_TOKEN
# twilio.phone.number=YOUR_TWILIO_PHONE_NUMBER

# ============================================
# ADDITIONAL SPRING BOOT CONFIGURATIONS
# ============================================
# Disable default Spring Security auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Actuator (Optional - for monitoring)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# ============================================
# Application
# ============================================
spring.application.name=connect-api-gateway
server.port=8080
server.address=0.0.0.0

# ============================================
# Eureka
# ============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

# ============================================
# Spring Cloud Gateway Routes
# ============================================

spring.cloud.gateway.routes[0].id=connect-auth-service
spring.cloud.gateway.routes[0].uri=lb://CONNECT-AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=connect-chat-service
spring.cloud.gateway.routes[1].uri=lb://CONNECT-CHAT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/chat/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[2].id=connect-video-service
spring.cloud.gateway.routes[2].uri=lb://CONNECT-VIDEO-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/video/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=2



# ============================================
# Global CORS (LAN + Browser Safe)
# ============================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# ============================================
# Actuator
# ============================================
management.endpoints.web.exposure.include=health,info
